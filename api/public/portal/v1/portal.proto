syntax = "proto3";

package api.public.portal.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/OmnTeam/ppanel-pro/api/public/portal/v1;v1";
option java_multiple_files = true;
option java_package = "api.public.portal.v1";

// Portal service for unregistered users
// 为未注册用户提供的公共门户服务
service Portal {
  // GetSubscription 获取订阅（未登录）
  rpc GetSubscription (GetSubscriptionRequest) returns (GetSubscriptionReply) {
    option (google.api.http) = {
      get: "/v1/public/portal/subscribe"
    };
  }

  // PrePurchaseOrder 预购买订单（未登录）- 计算价格
  rpc PrePurchaseOrder (PrePurchaseOrderRequest) returns (PrePurchaseOrderReply) {
    option (google.api.http) = {
      post: "/v1/public/portal/pre"
      body: "*"
    };
  }

  // Purchase 购买/创建订单（未登录）
  rpc Purchase (PurchaseRequest) returns (PurchaseReply) {
    option (google.api.http) = {
      post: "/v1/public/portal/purchase"
      body: "*"
    };
  }

  // GetAvailablePaymentMethods 获取可用支付方式（未登录）
  rpc GetAvailablePaymentMethods (google.protobuf.Empty) returns (GetAvailablePaymentMethodsReply) {
    option (google.api.http) = {
      get: "/v1/public/portal/payment-method"
    };
  }

  // PurchaseCheckout 购买结账（未登录）- 获取支付信息
  rpc PurchaseCheckout (PurchaseCheckoutRequest) returns (PurchaseCheckoutReply) {
    option (google.api.http) = {
      post: "/v1/public/portal/order/checkout"
      body: "*"
    };
  }

  // QueryPurchaseOrder 查询购买订单状态（未登录）
  rpc QueryPurchaseOrder (QueryPurchaseOrderRequest) returns (QueryPurchaseOrderReply) {
    option (google.api.http) = {
      get: "/v1/public/portal/order/status"
    };
  }
}

// GetSubscriptionRequest 获取订阅请求
message GetSubscriptionRequest {
  optional string language = 1;  // 语言（可选，如zh-CN, en-US）
}

// GetSubscriptionData 获取订阅数据
message GetSubscriptionData {
  repeated SubscribeInfo list = 1;
}

// GetSubscriptionReply 获取订阅响应
message GetSubscriptionReply {
  int32 code = 1;                  // 状态码
  string message = 2;              // 消息内容
  GetSubscriptionData data = 3;    // 响应数据
}

// SubscribeInfo 订阅信息
// ⚠️ 完全复刻原项目（server-master/internal/types/types.go:Subscribe）
message SubscribeInfo {
  string id = 1;
  string name = 2;
  string language = 3;
  optional string description = 4;
  string unit_price = 5;
  string unit_time = 6;
  repeated SubscribeDiscount discount = 7;
  string replacement = 8;
  string inventory = 9;
  string traffic = 10;
  string speed_limit = 11;
  string device_limit = 12;
  string quota = 13;
  repeated string nodes = 14;
  repeated string node_tags = 15;
  repeated string node_group_ids = 16;
  string node_group_id = 17;
  repeated TrafficLimit traffic_limit = 18;
  bool show = 19;
  bool sell = 20;
  string sort = 21;
  string deduction_ratio = 22;
  bool allow_deduction = 23;
  string reset_cycle = 24;
  bool renewal_reset = 25;
  bool show_original_price = 26;
  string created_at = 27;
  string updated_at = 28;
}

// SubscribeDiscount 订阅折扣配置
message SubscribeDiscount {
  string quantity = 1;  // 购买数量
  string discount = 2;  // 折扣值（百分比 0-100）
}

message TrafficLimit {
  string stat_type = 1;
  string stat_value = 2;
  string traffic_usage = 3;
  string speed_limit = 4;
}

// PrePurchaseOrderRequest 预购买订单请求
message PrePurchaseOrderRequest {
  string subscribe_id = 1;      // 订阅ID
  string quantity = 2;          // 数量
  optional string coupon = 3;  // 优惠券（可选）
  optional string payment_id = 4;  // 支付方式ID（可选，用于计算手续费）
}

// PrePurchaseOrderData 预购买订单数据（价格预览）
// ⚠️ 完全复刻原项目（server-master/internal/types/types.go:PrePurchaseOrderResponse）
message PrePurchaseOrderData {
  string price = 1;             // 原价
  string amount = 2;            // 实际支付金额（含手续费）
  string discount = 3;          // 折扣金额
  string coupon = 4;           // 优惠券代码
  string coupon_discount = 5;   // 优惠券折扣金额
  string fee_amount = 6;        // 手续费金额
}

// PrePurchaseOrderReply 预购买订单响应
message PrePurchaseOrderReply {
  int32 code = 1;                    // 状态码
  string message = 2;                // 消息内容
  PrePurchaseOrderData data = 3;     // 响应数据
}

// PurchaseRequest 购买请求
message PurchaseRequest {
  string subscribe_id = 1;           // 订阅ID
  string quantity = 2;                // 数量
  optional string coupon = 3;        // 优惠券（可选）
  string identifier = 4;             // 认证标识符（邮箱/Telegram ID等）
  string auth_type = 5;              // 认证类型（email/telegram等）
  string password = 6;               // 用户密码（明文，后端加密）
  optional string invite_code = 7;   // 邀请码（可选）
  string payment_id = 8;              // 支付方式ID（用于计算手续费）
}

// PurchaseData 购买数据
message PurchaseData {
  string order_no = 1;  // 订单号
}

// PurchaseReply 购买响应
message PurchaseReply {
  int32 code = 1;           // 状态码
  string message = 2;       // 消息内容
  PurchaseData data = 3;    // 响应数据
}

// GetAvailablePaymentMethodsData 获取可用支付方式数据
message GetAvailablePaymentMethodsData {
  repeated PaymentMethod list = 1;
}

// GetAvailablePaymentMethodsReply 获取可用支付方式响应
message GetAvailablePaymentMethodsReply {
  int32 code = 1;                             // 状态码
  string message = 2;                         // 消息内容
  GetAvailablePaymentMethodsData data = 3;    // 响应数据
}

// PaymentMethod 支付方式
message PaymentMethod {
  string id = 1;
  string name = 2;
  string platform = 3;      // 支付平台
  string description = 4;   // 支付描述
  string icon = 5;
  int32 fee_mode = 6;       // 费用模式：0=无费用 1=百分比 2=固定金额 3=百分比+固定金额
  string fee_percent = 7;    // 费用百分比
  string fee_amount = 8;     // 固定费用金额
}

// PurchaseCheckoutRequest 购买结账请求
message PurchaseCheckoutRequest {
  string order_no = 1 [json_name = "orderNo"];              // 订单号
  optional string return_url = 2 [json_name = "returnUrl"]; // 支付回调地址（可选）
}

// PurchaseCheckoutData 购买结账数据
// ⚠️ 完全复刻原项目（server-master/internal/types/types.go:CheckoutOrderResponse）
message PurchaseCheckoutData {
  string type = 1;                     // 支付类型：url/stripe/qr/balance
  optional string checkout_url = 2;    // 支付URL（type=url/qr时使用）
  optional StripePayment stripe = 3;   // Stripe支付信息（type=stripe时使用）
}

// PurchaseCheckoutReply 购买结账响应
message PurchaseCheckoutReply {
  int32 code = 1;                   // 状态码
  string message = 2;               // 消息内容
  PurchaseCheckoutData data = 3;    // 响应数据
}

// StripePayment Stripe支付信息
message StripePayment {
  string publishable_key = 1;          // Stripe公钥
  string client_secret = 2;            // 客户端密钥
  string method = 3;                   // 支付方式
}

// QueryPurchaseOrderRequest 查询购买订单请求
message QueryPurchaseOrderRequest {
  string order_no = 1;    // 订单号
  string auth_type = 2;   // 认证类型（email/telegram等）
  string identifier = 3;  // 认证标识符（邮箱/Telegram ID等）
}

// QueryPurchaseOrderData 查询购买订单数据
message QueryPurchaseOrderData {
  string order_no = 1;
  SubscribeInfo subscribe = 2;      // 订阅信息
  string quantity = 3;                // 数量
  string price = 4;                   // 原价
  string amount = 5;                  // 订单金额
  string discount = 6;                // 折扣金额
  string coupon = 7;                 // 优惠券代码
  string coupon_discount = 8;         // 优惠券折扣金额
  string fee_amount = 9;              // 手续费金额
  PaymentMethod payment = 10;        // 支付方式信息
  int32 status = 11;                 // 订单状态：1=待付款 2=已付款 3=关闭 4=失败 5=已完成
  string created_at = 12;             // 创建时间（毫秒时间戳）
  string token = 13;                 // Session token（订单已完成时返回）
}

// QueryPurchaseOrderReply 查询购买订单响应
message QueryPurchaseOrderReply {
  int32 code = 1;                     // 状态码
  string message = 2;                 // 消息内容
  QueryPurchaseOrderData data = 3;    // 响应数据
}
