syntax = "proto3";

package api.public.order.v1;

import "google/api/annotations.proto";

option go_package = "github.com/OmnTeam/ppanel-pro/api/public/order/v1;v1";
option java_multiple_files = true;
option java_package = "api.public.order.v1";

// Public Order service for user order operations
service PublicOrder {
  // Close order
  rpc CloseOrder(CloseOrderRequest) returns (OrderCloseReply) {
    option (google.api.http) = {
      post: "/v1/public/order/close"
      body: "*"
    };
  }

  // Query order detail
  rpc QueryOrderDetail(QueryOrderDetailRequest) returns (OrderDetailReply) {
    option (google.api.http) = {
      get: "/v1/public/order/detail"
    };
  }

  // Query order list
  rpc QueryOrderList(QueryOrderListRequest) returns (OrderListReply) {
    option (google.api.http) = {
      get: "/v1/public/order/list"
    };
  }

  // Pre-create order (validate and calculate price)
  rpc PreCreateOrder(PreCreateOrderRequest) returns (OrderPreCreateReply) {
    option (google.api.http) = {
      post: "/v1/public/order/pre"
      body: "*"
    };
  }

  // Purchase subscription
  rpc Purchase(PurchaseRequest) returns (PurchaseReply) {
    option (google.api.http) = {
      post: "/v1/public/order/purchase"
      body: "*"
    };
  }

  // Recharge (add balance)
  rpc Recharge(RechargeRequest) returns (RechargeReply) {
    option (google.api.http) = {
      post: "/v1/public/order/recharge"
      body: "*"
    };
  }

  // Renewal subscription
  rpc Renewal(RenewalRequest) returns (RenewalReply) {
    option (google.api.http) = {
      post: "/v1/public/order/renewal"
      body: "*"
    };
  }

  // Reset traffic
  rpc ResetTraffic(ResetTrafficRequest) returns (TrafficResetReply) {
    option (google.api.http) = {
      post: "/v1/public/order/reset"
      body: "*"
    };
  }
}

// CloseOrder Request
message CloseOrderRequest {
  string order_no = 1 [json_name = "orderNo"];  // Changed from order_id to order_no (string)
}

// OrderCloseData 关闭订单数据
message OrderCloseData {
  bool success = 1;
}

// OrderCloseReply 关闭订单响应
message OrderCloseReply {
  int32 code = 1;           // 状态码
  string message = 2;       // 消息内容
  OrderCloseData data = 3;  // 响应数据
}

// QueryOrderDetail Request
message QueryOrderDetailRequest {
  string order_no = 1 [json_name = "orderNo"];  // Changed from order_id to order_no (string)
}

// OrderDetailReply 查询订单详情响应
message OrderDetailReply {
  int32 code = 1;            // 状态码
  string message = 2;        // 消息内容
  OrderDetail data = 3;      // 响应数据，直接是 OrderDetail
}

// QueryOrderList Request
message QueryOrderListRequest {
  int32 page = 1;
  int32 size = 2;
  int32 status = 3;      // Optional: filter by status
  int32 type = 4;        // Optional: filter by type
}

// OrderListData 查询订单列表数据
message OrderListData {
  repeated OrderDetail list = 1;
  int32 total = 2;
}

// OrderListReply 查询订单列表响应
message OrderListReply {
  int32 code = 1;          // 状态码
  string message = 2;      // 消息内容
  OrderListData data = 3;  // 响应数据
}

// PreCreateOrder Request
message PreCreateOrderRequest {
  int32 type = 1;              // Order type: 1:订阅 2:续费 3:重置流量 4:充值
  string subscribe_id = 2;      // Subscribe ID (for renewal/reset)
  string subscribe_group_id = 3; // Subscribe group ID (for purchase)
  int32 quantity = 4;          // Quantity (for recharge or purchase)
  string coupon = 5;           // Changed from coupon_code to coupon
  string payment = 6;           // Changed from payment_id to payment
}

// OrderPreCreateData 预创建订单数据
message OrderPreCreateData {
  string price = 1;             // Original price
  string amount = 2;            // Final amount (after discount)
  string discount = 3;          // Discount amount
  string coupon_discount = 4;   // Coupon discount
  string fee_amount = 5;        // Payment fee
  string commission = 6;        // Commission
  string gift_amount = 7;       // Gift amount deduction (ADDED - was missing)
  bool valid = 8;              // Whether the order is valid
  string error_message = 9;    // Error message if not valid
}

// OrderPreCreateReply 预创建订单响应
message OrderPreCreateReply {
  int32 code = 1;               // 状态码
  string message = 2;           // 消息内容
  OrderPreCreateData data = 3;  // 响应数据
}

// Purchase Request
message PurchaseRequest {
  string subscribe_id = 1;       // Subscribe ID (ADDED - was missing)
  int32 quantity = 2;           // Quantity (ADDED - was missing)
  string coupon = 3;            // Changed from coupon_code to coupon
  string payment = 4;            // Changed from payment_id to payment
}

// PurchaseData 购买数据
// ⚠️ 完全复刻原项目（server-master/internal/types/types.go:PurchaseOrderResponse）
message PurchaseData {
  string order_no = 1 [json_name = "order_no"];  // 订单号
}

// PurchaseReply 购买响应
message PurchaseReply {
  int32 code = 1;         // 状态码
  string message = 2;     // 消息内容
  PurchaseData data = 3;  // 响应数据
}

// Recharge Request
message RechargeRequest {
  string amount = 1;             // Changed from quantity to amount
  string payment = 2;            // Changed from payment_id to payment
}

// RechargeData 充值数据
// ⚠️ 完全复刻原项目（server-master/internal/types/types.go:RechargeOrderResponse）
message RechargeData {
  string order_no = 1 [json_name = "order_no"];  // 订单号
}

// RechargeReply 充值响应
message RechargeReply {
  int32 code = 1;         // 状态码
  string message = 2;     // 消息内容
  RechargeData data = 3;  // 响应数据
}

// Renewal Request
message RenewalRequest {
  string user_subscribe_id = 1;  // Changed from subscribe_id to user_subscribe_id
  int32 quantity = 2;           // Quantity (ADDED - was missing)
  string coupon = 3;            // Changed from coupon_code to coupon
  string payment = 4;            // Changed from payment_id to payment
}

// RenewalData 续费数据
// ⚠️ 完全复刻原项目（server-master/internal/types/types.go:RenewalOrderResponse）
message RenewalData {
  string order_no = 1 [json_name = "order_no"];  // 订单号
}

// RenewalReply 续费响应
message RenewalReply {
  int32 code = 1;         // 状态码
  string message = 2;     // 消息内容
  RenewalData data = 3;   // 响应数据
}

// ResetTraffic Request
message ResetTrafficRequest {
  string user_subscribe_id = 1;  // Changed from subscribe_id to user_subscribe_id
  string payment = 2;            // Changed from payment_id to payment
}

// TrafficResetData 重置流量数据
// ⚠️ 完全复刻原项目（server-master/internal/types/types.go:ResetTrafficOrderResponse）
message TrafficResetData {
  string order_no = 1 [json_name = "order_no"];  // 订单号
}

// TrafficResetReply 重置流量响应
message TrafficResetReply {
  int32 code = 1;            // 状态码
  string message = 2;        // 消息内容
  TrafficResetData data = 3; // 响应数据
}

// PaymentMethod message
message PaymentMethod {
  string id = 1;
  string name = 2;
  string platform = 3;
  string description = 4;
  string icon = 5;
  int32 fee_mode = 6;
  string fee_percent = 7;
  string fee_amount = 8;
}

// SubscribeDiscount message
message SubscribeDiscount {
  int32 quantity = 1;
  string discount = 2;
}

// Subscribe message
message Subscribe {
  string id = 1;
  string name = 2;
  string language = 3;
  string description = 4;
  string unit_price = 5;
  string unit_time = 6;
  repeated SubscribeDiscount discount = 7;
  string replacement = 8;
  string inventory = 9;
  string traffic = 10;
  string speed_limit = 11;
  string device_limit = 12;
  string quota = 13;
  repeated int32 nodes = 14;
  repeated string node_tags = 15;
  bool show = 16;
  bool sell = 17;
  string sort = 18;
  string deduction_ratio = 19;
  bool allow_deduction = 20;
  repeated string node_group_ids = 21;
  string node_group_id = 22;
  repeated TrafficLimit traffic_limit = 23;
  string reset_cycle = 24;
  bool renewal_reset = 25;
  bool show_original_price = 26;
  string created_at = 27;
  string updated_at = 28;
}

message TrafficLimit {
  string stat_type = 1;
  string stat_value = 2;
  string traffic_usage = 3;
  string speed_limit = 4;
}

// OrderDetail message
message OrderDetail {
  string id = 1;
  string parent_id = 2;
  string user_id = 3;
  string order_no = 4;
  int32 type = 5;               // 1:订阅 2:续费 3:重置流量 4:充值
  int32 quantity = 6;
  string price = 7;
  string amount = 8;
  string gift_amount = 9;
  string discount = 10;
  string coupon = 11;
  string coupon_discount = 12;
  string commission = 13;
  PaymentMethod payment = 14;   // Nested payment method object
  string method = 15;
  string fee_amount = 16;
  string trade_no = 17;
  int32 status = 18;            // 1:待付款 2:已付款 3:关闭 4:失败 5:已完成
  string subscribe_id = 19;
  string subscribe_token = 20;
  bool is_new = 21;
  string created_at = 22;
  string updated_at = 23;
  Subscribe subscribe = 24;     // Nested subscribe object

  // Additional fields for public API (kept for backward compatibility)
  string subscribe_name = 25;   // Subscribe group name
  string payment_name = 26;     // Payment method name
  string status_text = 27;      // Status text
  string type_text = 28;        // Type text
}
