syntax = "proto3";

package api.public.document.v1;

option go_package = "github.com/OmnTeam/ppanel-pro/api/public/document/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Public Document service
// 公共文档服务（需要认证）
service Document {
  // QueryDocumentList 查询文档列表
  rpc QueryDocumentList (google.protobuf.Empty) returns (DocumentListReply) {
    option (google.api.http) = {
      get: "/v1/public/document/list"
    };
  }

  // QueryDocumentDetail 查询文档详情
  rpc QueryDocumentDetail (QueryDocumentDetailRequest) returns (DocumentDetailReply) {
    option (google.api.http) = {
      get: "/v1/public/document/detail"
    };
  }
}

// QueryDocumentDetailRequest 查询文档详情请求
message QueryDocumentDetailRequest {
  string id = 1;
}

// DocumentListData 文档列表数据
message DocumentListData {
  repeated DocumentItem list = 1;
  int32 total = 2;
}

// DocumentListReply 查询文档列表响应
message DocumentListReply {
  int32 code = 1;               // 状态码
  string message = 2;           // 消息内容
  DocumentListData data = 3;    // 响应数据
}

// DocumentItem 文档项（列表）
message DocumentItem {
  string id = 1;
  string title = 2;
  repeated string tags = 3;
  string updated_at = 4;
}

// DocumentDetailData 文档详情数据
message DocumentDetailData {
  string id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  string created_at = 5;
  string updated_at = 6;
}

// DocumentDetailReply 查询文档详情响应
message DocumentDetailReply {
  int32 code = 1;                 // 状态码
  string message = 2;             // 消息内容
  DocumentDetailData data = 3;    // 响应数据
}
