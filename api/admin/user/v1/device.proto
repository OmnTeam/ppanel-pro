syntax = "proto3";

package api.admin.user.v1;

option go_package = "github.com/OmnTeam/ppanel-pro/api/admin/user/v1;v1";

import "google/api/annotations.proto";

// UserDeviceService 用户设备管理服务
service UserDeviceService {
  // UpdateUserDevice 更新用户设备
  rpc UpdateUserDevice(UpdateUserDeviceRequest) returns (UpdateUserDeviceReply) {
    option (google.api.http) = {
      put: "/v1/admin/user/device"
      body: "*"
    };
  }

  // DeleteUserDevice 删除用户设备
  rpc DeleteUserDevice(DeleteUserDeviceRequest) returns (DeleteUserDeviceReply) {
    option (google.api.http) = {
      delete: "/v1/admin/user/device"
    };
  }

  // KickOfflineByUserDevice 踢下线用户设备
  rpc KickOfflineByUserDevice(KickOfflineByUserDeviceRequest) returns (KickOfflineByUserDeviceReply) {
    option (google.api.http) = {
      put: "/v1/admin/user/device/kick_offline"
      body: "*"
    };
  }
}

// ===== UpdateUserDevice =====

message UpdateUserDeviceRequest {
  int64 tenant_id = 1;
  int64 id = 2;  // 设备ID
  int64 subscribe_id = 3;  // 订阅ID
  string ip = 4;
  string identifier = 5;  // 设备标识符
  string user_agent = 6;
  bool online = 7;  // 是否在线
  bool enabled = 8;  // 是否启用
}

message UpdateUserDeviceReply {}

// ===== DeleteUserDevice =====

message DeleteUserDeviceRequest {
  int64 tenant_id = 1;
  int64 id = 2;  // 设备ID
}

message DeleteUserDeviceReply {}

// ===== KickOfflineByUserDevice =====

message KickOfflineByUserDeviceRequest {
  int64 tenant_id = 1;
  int64 id = 2;  // 设备ID
}

message KickOfflineByUserDeviceReply {}

// ===== Common Messages =====

// UserDevice 用户设备
message UserDevice {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  int64 subscribe_id = 4;  // 订阅ID
  string ip = 5;
  string identifier = 6;  // 设备标识符
  string user_agent = 7;
  bool online = 8;  // 是否在线
  bool enabled = 9;  // 是否启用
  int64 created_at = 10;  // Unix timestamp in milliseconds
  int64 updated_at = 11;  // Unix timestamp in milliseconds
}

// UserDeviceOnlineRecord 用户设备在线记录
message UserDeviceOnlineRecord {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  string identifier = 4;  // 设备标识符
  int64 online_time = 5;  // Unix timestamp in milliseconds
  int64 offline_time = 6;  // Unix timestamp in milliseconds
  int64 online_seconds = 7;  // 在线秒数
  int64 duration_days = 8;  // 持续天数
  int64 created_at = 9;  // Unix timestamp in milliseconds
}
