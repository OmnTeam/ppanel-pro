syntax = "proto3";

package api.admin.user.v1;

option go_package = "github.com/OmnTeam/ppanel-pro/api/admin/user/v1;v1";

import "google/api/annotations.proto";
import "admin/user/v1/auth_method.proto";
import "admin/user/v1/device.proto";

// UserService 用户基本管理服务
service UserService {
  // CreateUser 创建用户
  rpc CreateUser(CreateUserRequest) returns (CreateUserReply) {
    option (google.api.http) = {
      post: "/v1/admin/user"
      body: "*"
    };
  }

  // DeleteUser 删除用户
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserReply) {
    option (google.api.http) = {
      delete: "/v1/admin/user"
    };
  }

  // BatchDeleteUser 批量删除用户
  rpc BatchDeleteUser(BatchDeleteUserRequest) returns (BatchDeleteUserReply) {
    option (google.api.http) = {
      delete: "/v1/admin/user/batch"
    };
  }

  // CurrentUser 获取当前用户
  rpc CurrentUser(CurrentUserRequest) returns (CurrentUserReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/current"
    };
  }

  // GetUserDetail 获取用户详情
  rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/detail"
    };
  }

  // GetUserList 获取用户列表
  rpc GetUserList(GetUserListRequest) returns (GetUserListReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/list"
    };
  }

  // UpdateUserBasicInfo 更新用户基本信息
  rpc UpdateUserBasicInfo(UpdateUserBasicInfoRequest) returns (UpdateUserBasicInfoReply) {
    option (google.api.http) = {
      put: "/v1/admin/user/basic"
      body: "*"
    };
  }

  // UpdateUserNotifySettings 更新用户通知设置
  rpc UpdateUserNotifySettings(UpdateUserNotifySettingsRequest) returns (UpdateUserNotifySettingsReply) {
    option (google.api.http) = {
      put: "/v1/admin/user/notify"
      body: "*"
    };
  }

  // GetUserLoginLogs 获取用户登录日志
  rpc GetUserLoginLogs(GetUserLoginLogsRequest) returns (GetUserLoginLogsReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/login/logs"
    };
  }
}

// ===== CreateUser =====

message CreateUserRequest {
  int64 tenant_id = 1;
  string email = 2;
  string telephone = 3;
  string telephone_area_code = 4;
  string password = 5;
  int64 product_id = 6;
  int64 duration = 7;
  int32 referral_percentage = 8;
  bool only_first_purchase = 9;
  string referer_user = 10;  // 推荐人邮箱
  string refer_code = 11;
  int64 balance = 12;
  int64 commission = 13;
  int64 gift_amount = 14;
  bool is_admin = 15;
}

message CreateUserData {
  int64 user_id = 1;
}

message CreateUserReply {
  int32 code = 1;        // 状态码
  string message = 2;    // 消息内容
  CreateUserData data = 3; // 响应数据
}

// ===== DeleteUser =====

message DeleteUserRequest {
  int64 tenant_id = 1;
  int64 user_id = 2;
}

message DeleteUserData {
  bool success = 1;
}

message DeleteUserReply {
  int32 code = 1;        // 状态码
  string message = 2;    // 消息内容
  DeleteUserData data = 3; // 响应数据
}

// ===== BatchDeleteUser =====

message BatchDeleteUserRequest {
  int64 tenant_id = 1;
  repeated int64 user_ids = 2;
}

message BatchDeleteUserData {
  int64 deleted_count = 1;
}

message BatchDeleteUserReply {
  int32 code = 1;              // 状态码
  string message = 2;          // 消息内容
  BatchDeleteUserData data = 3; // 响应数据
}

// ===== CurrentUser =====

message CurrentUserRequest {
  int64 tenant_id = 1;
  int64 user_id = 2;  // 当前登录用户ID
}

message CurrentUserData {
  User user = 1;
}

message CurrentUserReply {
  int32 code = 1;          // 状态码
  string message = 2;      // 消息内容
  CurrentUserData data = 3; // 响应数据
}

// ===== GetUserDetail =====

message GetUserDetailRequest {
  int64 tenant_id = 1;
  int64 id = 2;  // 用户ID (与老项目保持一致，使用id而不是user_id)
}

message GetUserDetailReply {
  int32 code = 1;            // 状态码
  string message = 2;        // 消息内容
  User data = 3;             // 响应数据（直接返回用户对象）
}

// ===== GetUserList =====

message GetUserListRequest {
  int64 tenant_id = 1;
  int32 page = 2;
  int32 size = 3;
  string search = 4;  // 搜索关键字（邮箱、手机号等）
  int64 user_id = 5;  // 过滤特定用户ID
  int64 subscribe_id = 6;  // 过滤订阅套餐ID
  int64 user_subscribe_id = 7;  // 过滤用户订阅ID
}

message GetUserListData {
  int64 total = 1;
  repeated User list = 2;
}

message GetUserListReply {
  int32 code = 1;          // 状态码
  string message = 2;      // 消息内容
  GetUserListData data = 3; // 响应数据
}

// ===== UpdateUserBasicInfo =====

message UpdateUserBasicInfoRequest {
  int64 tenant_id = 1;              // 租户ID (内部字段，前端无需传)
  int64 user_id = 2;                // 用户ID
  string password = 3;              // 新密码（可选）
  string avatar = 4;                // 头像
  int64 balance = 5;                // 余额
  int64 commission = 6;             // 佣金
  int32 referral_percentage = 7;    // 推荐返利比例
  bool only_first_purchase = 8;     // 仅首次购买返利
  int64 gift_amount = 9;            // 赠送金额
  int64 telegram = 10;              // Telegram ID
  string refer_code = 11;           // 推荐码
  int64 referer_id = 12;            // 推荐人ID
  bool enable = 13;                 // 是否启用
  bool is_admin = 14;               // 是否管理员
}

message UpdateUserBasicInfoReply {
  int32 code = 1;                  // 状态码
  string message = 2;              // 消息内容
}

// ===== UpdateUserNotifySettings =====

message UpdateUserNotifySettingsRequest {
  int64 tenant_id = 1;
  int64 user_id = 2;
  bool enable_balance_notify = 3;
  bool enable_login_notify = 4;
  bool enable_subscribe_notify = 5;
  bool enable_trade_notify = 6;
}

message UpdateUserNotifySettingsReply {
  int32 code = 1;                        // 状态码
  string message = 2;                    // 消息内容
}

// ===== GetUserLoginLogs =====

message GetUserLoginLogsRequest {
  int64 tenant_id = 1;
  int32 page = 2;
  int32 size = 3;
  int64 user_id = 4;  // 可选：过滤特定用户
  string date = 5;    // 可选：过滤日期 (YYYY-MM-DD)
}

message GetUserLoginLogsData {
  int64 total = 1;
  repeated LoginLog list = 2;
}

message GetUserLoginLogsReply {
  int32 code = 1;                // 状态码
  string message = 2;            // 消息内容
  GetUserLoginLogsData data = 3; // 响应数据
}

// ===== Common Messages =====

// User 用户信息
message User {
  int64 id = 1;
  int64 tenant_id = 2;
  string email = 3;
  string telephone = 4;
  string telephone_area_code = 5;
  string avatar = 6;
  int64 balance = 7;
  string refer_code = 8;
  int64 referer_id = 9;
  int64 commission = 10;
  int32 referral_percentage = 11;
  bool only_first_purchase = 12;
  int64 gift_amount = 13;
  bool enable = 14;
  bool is_admin = 15;
  bool enable_balance_notify = 16;
  bool enable_login_notify = 17;
  bool enable_subscribe_notify = 18;
  bool enable_trade_notify = 19;
  int64 created_at = 20;  // Unix timestamp in milliseconds
  int64 updated_at = 21;  // Unix timestamp in milliseconds
  int64 telegram = 22;  // Telegram ID
  repeated UserAuthMethod auth_methods = 23;  // 用户认证方法列表
  repeated UserDevice user_devices = 24;  // 用户设备列表
}

// LoginLog 登录日志
message LoginLog {
  int64 user_id = 1;
  string method = 2;       // 登录方法
  string login_ip = 3;     // 登录IP
  string user_agent = 4;   // 用户代理
  bool success = 5;        // 是否成功
  int64 timestamp = 6;     // Unix timestamp in milliseconds
}
