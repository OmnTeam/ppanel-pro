syntax = "proto3";

package api.admin.user.v1;

option go_package = "github.com/OmnTeam/ppanel-pro/api/admin/user/v1;v1";

import "google/api/annotations.proto";
import "api/admin/user/v1/auth_method.proto";
import "api/admin/user/v1/device.proto";

// UserService 用户基本管理服务
service UserService {
  // CreateUser 创建用户
  rpc CreateUser(CreateUserRequest) returns (CreateUserReply) {
    option (google.api.http) = {
      post: "/v1/admin/user"
      body: "*"
    };
  }

  // DeleteUser 删除用户
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserReply) {
    option (google.api.http) = {
      delete: "/v1/admin/user"
    };
  }

  // BatchDeleteUser 批量删除用户
  rpc BatchDeleteUser(BatchDeleteUserRequest) returns (BatchDeleteUserReply) {
    option (google.api.http) = {
      delete: "/v1/admin/user/batch"
    };
  }

  // CurrentUser 获取当前用户
  rpc CurrentUser(CurrentUserRequest) returns (CurrentUserReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/current"
    };
  }

  // GetUserDetail 获取用户详情
  rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/detail"
    };
  }

  // GetUserList 获取用户列表
  rpc GetUserList(GetUserListRequest) returns (GetUserListReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/list"
    };
  }

  // UpdateUserBasicInfo 更新用户基本信息
  rpc UpdateUserBasicInfo(UpdateUserBasicInfoRequest) returns (UpdateUserBasicInfoReply) {
    option (google.api.http) = {
      put: "/v1/admin/user/basic"
      body: "*"
    };
  }

  // UpdateUserNotifySettings 更新用户通知设置
  rpc UpdateUserNotifySettings(UpdateUserNotifySettingsRequest) returns (UpdateUserNotifySettingsReply) {
    option (google.api.http) = {
      put: "/v1/admin/user/notify"
      body: "*"
    };
  }

  // GetUserLoginLogs 获取用户登录日志
  rpc GetUserLoginLogs(GetUserLoginLogsRequest) returns (GetUserLoginLogsReply) {
    option (google.api.http) = {
      get: "/v1/admin/user/login/logs"
    };
  }
}

message CreateUserRequest {
  string email = 1;
  string telephone = 2;
  string telephone_area_code = 3;
  string password = 4;
  string product_id = 5;
  string duration = 6;
  int32 referral_percentage = 7;
  bool only_first_purchase = 8;
  string referer_user = 9;
  string refer_code = 10;
  string balance = 11;
  string commission = 12;
  string gift_amount = 13;
  bool is_admin = 14;
}

message CreateUserData {
  string user_id = 1;
}

message CreateUserReply {
  int32 code = 1;
  string message = 2;
  CreateUserData data = 3;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserData {
  bool success = 1;
}

message DeleteUserReply {
  int32 code = 1;
  string message = 2;
  DeleteUserData data = 3;
}

message BatchDeleteUserRequest {
  repeated string user_ids = 1;
}

message BatchDeleteUserData {
  string deleted_count = 1;
}

message BatchDeleteUserReply {
  int32 code = 1;
  string message = 2;
  BatchDeleteUserData data = 3;
}

message CurrentUserRequest {
  string user_id = 1;
}

message CurrentUserData {
  User user = 1;
}

message CurrentUserReply {
  int32 code = 1;
  string message = 2;
  CurrentUserData data = 3;
}

message GetUserDetailRequest {
  string id = 1;
}

message GetUserDetailReply {
  int32 code = 1;
  string message = 2;
  User data = 3;
}

message GetUserListRequest {
  int32 page = 1;
  int32 size = 2;
  string search = 3;
  string user_id = 4;
  string subscribe_id = 5;
  string user_subscribe_id = 6;
}

message GetUserListData {
  string total = 1;
  repeated User list = 2;
}

message GetUserListReply {
  int32 code = 1;
  string message = 2;
  GetUserListData data = 3;
}

message UpdateUserBasicInfoRequest {
  string user_id = 1;
  string password = 2;
  string avatar = 3;
  string balance = 4;
  string commission = 5;
  int32 referral_percentage = 6;
  bool only_first_purchase = 7;
  string gift_amount = 8;
  string telegram = 9;
  string refer_code = 10;
  string referer_id = 11;
  bool enable = 12;
  bool is_admin = 13;
}

message UpdateUserBasicInfoReply {
  int32 code = 1;
  string message = 2;
}

message UpdateUserNotifySettingsRequest {
  string user_id = 1;
  bool enable_balance_notify = 2;
  bool enable_login_notify = 3;
  bool enable_subscribe_notify = 4;
  bool enable_trade_notify = 5;
}

message UpdateUserNotifySettingsReply {
  int32 code = 1;
  string message = 2;
}

message GetUserLoginLogsRequest {
  int32 page = 1;
  int32 size = 2;
  string user_id = 3;
  string date = 4;
}

message GetUserLoginLogsData {
  string total = 1;
  repeated LoginLog list = 2;
}

message GetUserLoginLogsReply {
  int32 code = 1;
  string message = 2;
  GetUserLoginLogsData data = 3;
}

message User {
  string id = 1;
  string email = 2;
  string telephone = 3;
  string telephone_area_code = 4;
  string avatar = 5;
  string balance = 6;
  string refer_code = 7;
  string referer_id = 8;
  string commission = 9;
  int32 referral_percentage = 10;
  bool only_first_purchase = 11;
  string gift_amount = 12;
  bool enable = 13;
  bool is_admin = 14;
  bool enable_balance_notify = 15;
  bool enable_login_notify = 16;
  bool enable_subscribe_notify = 17;
  bool enable_trade_notify = 18;
  string created_at = 19;
  string updated_at = 20;
  string telegram = 21;
  repeated UserAuthMethod auth_methods = 22;
  repeated UserDevice user_devices = 23;
}

message LoginLog {
  string user_id = 1;
  string method = 2;
  string login_ip = 3;
  string user_agent = 4;
  bool success = 5;
  string timestamp = 6;
}
