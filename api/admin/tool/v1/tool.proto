syntax = "proto3";

package api.admin.tool.v1;

import "google/api/annotations.proto";

option go_package = "github.com/OmnTeam/ppanel-pro/api/admin/tool/v1;v1";
option java_multiple_files = true;
option java_package = "api.admin.tool.v1";

service Tool {
  // GetSystemLog 获取系统日志
  rpc GetSystemLog (GetSystemLogRequest) returns (GetSystemLogReply) {
    option (google.api.http) = {
      get: "/v1/admin/tool/log"
    };
  }

  // RestartSystem 重启系统
  rpc RestartSystem (RestartSystemRequest) returns (RestartSystemReply) {
    option (google.api.http) = {
      get: "/v1/admin/tool/restart"
    };
  }

  // GetVersion 获取版本信息
  rpc GetVersion (GetVersionRequest) returns (GetVersionReply) {
    option (google.api.http) = {
      get: "/v1/admin/tool/version"
    };
  }

  // QueryIPLocation 查询IP地理位置
  rpc QueryIPLocation (QueryIPLocationRequest) returns (QueryIPLocationReply) {
    option (google.api.http) = {
      get: "/v1/admin/tool/ip/location"
    };
  }
}

// ==================== Messages ====================

// LogEntry 日志条目
message LogEntry {
  int64 timestamp = 1; // 时间戳
  string level = 2;     // 日志级别
  string message = 3;   // 日志消息
  string source = 4;    // 日志来源
}

// GetSystemLogRequest 获取系统日志请求
message GetSystemLogRequest {
  int64 page = 1;       // 页码
  int64 size = 2;       // 每页数量
  string level = 3;     // 日志级别过滤（可选）
}

// GetSystemLogData 获取系统日志数据
message GetSystemLogData {
  repeated LogEntry logs = 1; // 日志列表
  int64 total = 2;             // 总数
}

// GetSystemLogReply 获取系统日志响应
message GetSystemLogReply {
  int32 code = 1;                // 状态码
  string message = 2;            // 消息内容
  GetSystemLogData data = 3;     // 响应数据
}

// RestartSystemRequest 重启系统请求
message RestartSystemRequest {
  bool confirm = 1; // 确认重启
}

// RestartSystemData 重启系统数据
message RestartSystemData {
  bool success = 1;  // 是否成功
  string message = 2; // 提示消息
}

// RestartSystemReply 重启系统响应
message RestartSystemReply {
  int32 code = 1;                  // 状态码
  string message = 2;              // 消息内容
  RestartSystemData data = 3;      // 响应数据
}

// GetVersionRequest 获取版本信息请求
message GetVersionRequest {}

// VersionInfo 版本信息
message VersionInfo {
  string version = 1;     // 版本号
  string build_time = 2;  // 构建时间
  string git_commit = 3;  // Git提交哈希
  string go_version = 4;  // Go版本
}

// GetVersionData 获取版本数据
message GetVersionData {
  VersionInfo version = 1; // 版本信息
}

// GetVersionReply 获取版本信息响应
message GetVersionReply {
  int32 code = 1;              // 状态码
  string message = 2;          // 消息内容
  GetVersionData data = 3;     // 响应数据
}

// QueryIPLocationRequest 查询IP地理位置请求
message QueryIPLocationRequest {
  string ip = 1; // IP地址
}

// IPLocation IP地理位置信息
message IPLocation {
  string country = 1;  // 国家
  string region = 2;   // 地区
  string city = 3;     // 城市
  string isp = 4;      // 运营商
}

// QueryIPLocationData 查询IP地理位置数据
message QueryIPLocationData {
  IPLocation location = 1; // 位置信息
}

// QueryIPLocationReply 查询IP地理位置响应
message QueryIPLocationReply {
  int32 code = 1;                    // 状态码
  string message = 2;                // 消息内容
  QueryIPLocationData data = 3;      // 响应数据
}
