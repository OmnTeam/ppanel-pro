syntax = "proto3";

package api.admin.order.v1;

import "google/api/annotations.proto";

option go_package = "github.com/OmnTeam/ppanel-pro/api/admin/order/v1;v1";
option java_multiple_files = true;
option java_package = "api.admin.order.v1";

service OrderService {
  // CreateOrder 创建订单
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderReply) {
    option (google.api.http) = {
      post: "/v1/admin/order"
      body: "*"
    };
  }

  // GetOrderList 获取订单列表
  rpc GetOrderList (GetOrderListRequest) returns (GetOrderListReply) {
    option (google.api.http) = {
      get: "/v1/admin/order/list"
    };
  }

  // UpdateOrderStatus 更新订单状态
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderStatusReply) {
    option (google.api.http) = {
      put: "/v1/admin/order/status"
      body: "*"
    };
  }
}

// CreateOrderRequest 创建订单请求
message CreateOrderRequest {
  int64 tenant_id = 1;          // 租户ID
  int64 user_id = 2;            // 用户ID
  int32 type = 3;               // 订单类型：1:订阅 2:续费 3:重置流量 4:充值
  int64 quantity = 4;           // 数量
  int64 price = 5;              // 原价
  int64 amount = 6;             // 订单金额
  int64 discount = 7;           // 折扣金额
  string coupon = 8;            // 优惠券
  int64 coupon_discount = 9;    // 优惠券折扣金额
  int64 commission = 10;        // 订单佣金
  int64 fee_amount = 11;        // 手续费金额
  int64 payment_id = 12;        // 支付ID
  string trade_no = 13;         // 交易号
  int32 status = 14;            // 订单状态：1:待付款 2:已付款 3:关闭 4:失败 5:已完成
  int64 subscribe_id = 15;      // 订阅ID
}

// CreateOrderReply 创建订单响应
message CreateOrderReply {
  int32 code = 1;     // 状态码
  string message = 2; // 消息内容
}

// UpdateOrderStatusRequest 更新订单状态请求
message UpdateOrderStatusRequest {
  int64 id = 1;           // 订单ID
  int64 tenant_id = 2;    // 租户ID
  int32 status = 3;       // 订单状态
  int64 payment_id = 4;   // 支付ID（可选）
  string trade_no = 5;    // 交易号（可选）
}

// UpdateOrderStatusReply 更新订单状态响应
message UpdateOrderStatusReply {
  int32 code = 1;     // 状态码
  string message = 2; // 消息内容
}

// GetOrderListRequest 获取订单列表请求
message GetOrderListRequest {
  int64 tenant_id = 1;     // 租户ID
  int64 page = 2;          // 页码
  int64 size = 3;          // 每页数量
  int64 user_id = 4;       // 用户ID（可选）
  int32 status = 5;        // 订单状态（可选）
  int64 subscribe_id = 6;  // 订阅ID（可选）
  string search = 7;       // 搜索关键字（可选）
}

// GetOrderListData 订单列表数据
message GetOrderListData {
  repeated OrderItem list = 1;  // 订单列表
  int64 total = 2;              // 总数
}

// GetOrderListReply 获取订单列表响应
message GetOrderListReply {
  int32 code = 1;             // 状态码
  string message = 2;         // 消息内容
  GetOrderListData data = 3;  // 响应数据
}

// OrderItem 订单项
message OrderItem {
  int64 id = 1;                 // 订单ID
  int64 parent_id = 2;          // 父订单ID
  int64 user_id = 3;            // 用户ID
  string order_no = 4;          // 订单号
  int32 type = 5;               // 订单类型
  int64 quantity = 6;           // 数量
  int64 price = 7;              // 原价
  int64 amount = 8;             // 订单金额
  int64 gift_amount = 9;        // 用户礼品金额
  int64 discount = 10;          // 折扣金额
  string coupon = 11;           // 优惠券
  int64 coupon_discount = 12;   // 优惠券折扣金额
  int64 commission = 13;        // 订单佣金
  int64 payment_id = 14;        // 支付ID
  string method = 15;           // 支付方式
  int64 fee_amount = 16;        // 手续费金额
  string trade_no = 17;         // 交易号
  int32 status = 18;            // 订单状态
  int64 subscribe_id = 19;      // 订阅ID
  string subscribe_token = 20;  // 续费订阅令牌
  bool is_new = 21;             // 是否新订单
  int64 created_at = 22;        // 创建时间
  int64 updated_at = 23;        // 更新时间
}
